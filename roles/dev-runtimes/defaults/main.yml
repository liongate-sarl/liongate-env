---
# Versions are the source of truth here and mirror the Tech Radar.
# Change a value to bump the corresponding runtime.

# Node.js / pnpm (installed per user via nvm + Corepack)
devruntimes_nvm_version: "0.40.1"
devruntimes_node_version: "22"
devruntimes_pnpm_version: "11.18.0"

# Python (installed per user via pyenv; compiled from source)
devruntimes_python_version: "3.12.7"

# Java (installed per user via SDKMAN; Temurin build)
# SDKMAN only serves the latest builds: bump this when an install fails with
# "not a valid java version" (list them with `sdk list java | grep tem`).
devruntimes_java_version: "21.0.12+1.1-tem"

# PHP (system package from the Ubuntu LTS archive) and Composer (pinned phar,
# checked against the sha256 published by getcomposer.org)
devruntimes_composer_version: "2.11.1"
devruntimes_php_packages:
  - php-cli
  - php-curl
  - php-intl
  - php-mbstring
  - php-xml
  - php-zip
  - unzip

# PHP CLI extensions that must be enabled (names as in conf.d/*.ini).
# php-cli and php-xml ship most of them; missing ones are enabled with phpenmod.
devruntimes_php_extensions:
  - calendar
  - ctype
  - curl
  - dom
  - exif
  - ffi
  - fileinfo
  - ftp
  - gettext
  - iconv
  - intl
  - mbstring
  - pdo
  - phar
  - posix
  - readline
  - shmop
  - simplexml
  - sockets
  - sysvmsg
  - sysvsem
  - sysvshm
  - tokenizer
  - xml
  - xmlreader
  - xmlwriter
  - xsl
  - zip

# Per-user install locations
devruntimes_nvm_dir: "{{ ansible_user_dir }}/.nvm"
devruntimes_pyenv_root: "{{ ansible_user_dir }}/.pyenv"
devruntimes_sdkman_dir: "{{ ansible_user_dir }}/.sdkman"

# Build dependencies required to compile Python with pyenv.
devruntimes_python_build_deps:
  - make
  - build-essential
  - libssl-dev
  - zlib1g-dev
  - libbz2-dev
  - libreadline-dev
  - libsqlite3-dev
  - libffi-dev
  - liblzma-dev
  - tk-dev
  - libncursesw5-dev
  - xz-utils
