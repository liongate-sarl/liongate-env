---
# End-user apps from the Ubuntu archive.
userstack_base_apps:
  - vlc
  - libreoffice

# Thunderbird, from the Mozilla Team PPA (Launchpad signing key).
userstack_mozillateam_key_fingerprint: 738BEB9321D1AAEC13EA9391AEBDF4819BE21867

# Insomnia — no apt repo; the latest .deb is resolved from GitHub releases.
userstack_insomnia_repo: "Kong/insomnia"

# Postman — no apt repo; installed from the official tarball into /opt.
userstack_postman_url: "https://dl.pstmn.io/download/latest/linux_64"
userstack_postman_dir: /opt/postman

# JetBrains Toolbox — no apt repo; pinned tarball (checked against the sha256
# JetBrains publishes next to it) unpacked into /opt. The app then updates
# itself and installs the IDEs per user, under ~/.local/share/JetBrains.
userstack_jetbrains_toolbox_version: "3.9.1.89198"
userstack_jetbrains_toolbox_dir: /opt/jetbrains-toolbox

# Docker Desktop (.deb). Requires KVM at runtime, so it is gated and is NOT
# verified in the container self-test. Docker removes old versioned .debs
# from its CDN, so the unversioned URL (always the latest release) is used.
userstack_docker_desktop: true
userstack_docker_desktop_deb_url: https://desktop.docker.com/linux/main/amd64/docker-desktop-amd64.deb

# Security scanner images used by the projects' scans (Semgrep for SAST,
# OWASP ZAP for DAST, Gitleaks for secrets), pulled ahead of time into Docker
# Desktop, or into Docker Engine when Docker Desktop is off.
# Set to false to skip them (e.g. in CI, where no Docker daemon runs).
userstack_pull_security_images: true
userstack_security_images:
  - "semgrep/semgrep:latest"
  - "ghcr.io/zaproxy/zaproxy:stable"
  - "ghcr.io/gitleaks/gitleaks:v8.30.1"

# Onboarding welcome file.
userstack_onboarding_file: "{{ ansible_user_dir }}/liongate-onboarding.md"
