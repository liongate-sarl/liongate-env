---
# End-user apps from the Ubuntu archive.
userstack_base_apps:
  - vlc
  - libreoffice

# Insomnia — no apt repo; installed from the latest official .deb.
userstack_insomnia_deb_url: "https://updates.insomnia.rest/downloads/ubuntu/latest?app=Insomnia%20Core&source=website"

# Postman — no apt repo; installed from the official tarball into /opt.
userstack_postman_url: "https://dl.pstmn.io/download/latest/linux_64"
userstack_postman_dir: /opt/postman

# Docker Desktop (.deb). Requires KVM at runtime, so it is gated and is NOT
# verified in the container self-test. Update the version as needed.
userstack_docker_desktop: true
userstack_docker_desktop_version: "4.34.3"
userstack_docker_desktop_deb_url: >-
  https://desktop.docker.com/linux/main/amd64/docker-desktop-{{ userstack_docker_desktop_version }}-amd64.deb

# Onboarding welcome file.
userstack_onboarding_file: "{{ ansible_user_dir }}/liongate-onboarding.md"
