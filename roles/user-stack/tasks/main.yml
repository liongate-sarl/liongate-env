---
- name: Ensure the apt keyrings directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Determine the dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: userstack_dpkg_arch
  changed_when: false

- name: Install base apps
  ansible.builtin.import_tasks: base-apps.yml

- name: Install apps from third-party apt repos
  ansible.builtin.import_tasks: apt-repo-apps.yml

- name: Install Insomnia
  ansible.builtin.import_tasks: insomnia.yml

- name: Install Postman
  ansible.builtin.import_tasks: postman.yml

- name: Install Docker Desktop
  ansible.builtin.import_tasks: docker-desktop.yml

- name: Deploy onboarding materials
  ansible.builtin.import_tasks: onboarding.yml
