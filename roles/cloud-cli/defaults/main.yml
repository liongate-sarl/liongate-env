---
# Versions / channels are the source of truth here and mirror the Tech Radar.

# kubectl apt repo minor channel (pkgs.k8s.io)
cloudcli_kubectl_channel: "v1.31"

# Helm version (installed from the official get.helm.sh release tarball)
cloudcli_helm_version: "v3.16.3"

# PostgreSQL client major version (PGDG apt repo)
cloudcli_postgres_version: "16"

# DbGate version (installed from the official GitHub release .deb).
# Upstream only publishes an amd64 .deb.
cloudcli_dbgate_version: "7.3.2"

# Set to false to skip DbGate (e.g. on servers or in CI, where the heavy
# Electron desktop app is unnecessary).
cloudcli_install_dbgate: true

# Prerequisite packages the repos and installers need.
cloudcli_prerequisites:
  - ca-certificates
  - curl
  - gnupg
  - unzip
  - apt-transport-https
