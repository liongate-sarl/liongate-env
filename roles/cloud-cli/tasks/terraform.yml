---
- name: Add the HashiCorp apt signing key
  become: true
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /etc/apt/keyrings/hashicorp.asc
    mode: "0644"

- name: Add the HashiCorp apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ cloudcli_dpkg_arch.stdout }}
      signed-by=/etc/apt/keyrings/hashicorp.asc]
      https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main
    filename: hashicorp
    state: present

- name: Install Terraform
  become: true
  ansible.builtin.apt:
    name: terraform
    state: present
    update_cache: true
