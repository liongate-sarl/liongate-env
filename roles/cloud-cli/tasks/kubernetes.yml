---
# kubectl (official Kubernetes apt repo: pkgs.k8s.io)
- name: Add the Kubernetes apt signing key
  become: true
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ cloudcli_kubectl_channel }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"

- name: Add the Kubernetes apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/{{ cloudcli_kubectl_channel }}/deb/ /"
    filename: kubernetes
    state: present

- name: Install kubectl
  become: true
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true

# Helm (official Helm apt repo)
- name: Add the Helm apt signing key
  become: true
  ansible.builtin.get_url:
    url: https://baltocdn.com/helm/signing.asc
    dest: /etc/apt/keyrings/helm.asc
    mode: "0644"

- name: Add the Helm apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ cloudcli_dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/helm.asc] https://baltocdn.com/helm/stable/debian/ all main"
    filename: helm
    state: present

- name: Install Helm
  become: true
  ansible.builtin.apt:
    name: helm
    state: present
    update_cache: true
