---
# Root provisioning playbook for Liongate workstations.
#
# The common role always runs (base packages, Git and SSH configuration).
# Stack roles are added under the 'dev' and 'user' tags in later WKS tickets.
- name: Provision Liongate workstation
  hosts: all
  gather_facts: true
  roles:
    - role: common
      tags: [common, dev, user]
    - role: dev-runtimes
      tags: [dev]
    - role: cloud-cli
      tags: [dev]
    - role: vscode
      tags: [dev]
